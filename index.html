<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="src/style.css">
  <script src="src/script.js" defer></script>
  <title>css-playground</title>
</head>

<body>
  <nav
    class="px-4 py-4 shadow-[0px_6px_0px_0px_rgba(123,_0,_40,_1)] flex flex-row items-center justify-between bg-[#F0003C] text-white relative group/nav hover:cursor-[url(https://www.google.com/url?sa=t&source=web&rct=j&url=https%3A%2F%2Fgreatcharacters.miraheze.org%2Fwiki%2FSpongeBob_SquarePants_(seasons_1-6a%2C_7b-present)&ved=0CBYQjRxqFwoTCIC6rqCMs5IDFQAAAAAdAAAAABAI&opi=89978449),pointer]">
    <a href="#">
      <img src="https://img.icons8.com/?size=100&id=22445&format=png&color=000000" alt="Logo" width="50" height="50"
        class="hover:rotate-360 duration-1000 ease-[cubic-bezier(0.8,-0.4,0.5,1)] invert">
    </a>

    <div class="space-x-10 flex flex-row font-bold text-2xl ">
      <a href="" data-link-alt="Retro"
        class="nav-link w-fit text-black no-underline relative block overflow-hidden before:absolute before:content-[attr(data-link-alt)] before:top-[100%] before:opacity-0 before:duration-300 hover:before:top-0 hover:before:opacity-100 hover:before:underline group/ahref"><span
          class="text-white block duration-300 group-hover/ahref:translate-y-full">Retro</a>
      <a href="" data-link-alt="Modern"
        class="nav-link w-fit text-black no-underline relative block overflow-hidden before:absolute before:content-[attr(data-link-alt)] before:top-[100%] before:opacity-0 before:duration-300 hover:before:top-0 hover:before:opacity-100 hover:before:underline group/ahref"><span
          class="text-white block duration-300 group-hover/ahref:translate-x-full">Modern</a>
      <a href="" data-link-alt="Cartoon"
        class="nav-link w-fit text-black no-underline relative block overflow-hidden before:absolute before:content-[attr(data-link-alt)] before:top-[-100%] before:opacity-0 before:duration-300 hover:before:top-0 hover:before:opacity-100 hover:before:underline group/ahref"><span
          class="text-white block duration-300 group-hover/ahref:-translate-y-full">Cartoon</a>
    </div>

    <div>
      <button class="button-82-pushable" role="button" id="blue-button">
        <span class="button-82-shadow"></span>
        <span class="button-82-edge"></span>
        <span class="button-82-front text">Button</span>
      </button>
    </div>
    <span
      class="nav-text invisible scale-[50%] text-white text-center absolute z-1 bottom-[-60%] left-[45%] opacity-0 group-after:content-none group-after:absolute group-after:top-[-10%] group-after:left-[50%] group-hover/nav:opacity-100 group-hover/nav:rotate-360 group-hover/nav:scale-[150%] group-hover/nav:visible transition-all duration-600 font-bold text-2xl">Dit
      is de
      Nav Bar!</span>
  </nav>

  <main class="bg-gray-200">
    <div id="space"
      class="h-100 w-full absolute bg-[url(/src/img/space-background.jpg)] cursor-[url(/src/cursor/space-cursor.png),_pointer] active:cursor-[url(/src/cursor/space-cursor-click.png),_pointer]">

      <div class="earth-planet absolute top-20 left-10">
        <img src="/src/img/earth-planet.png" width="80" height="80">
      </div>
    </div>
  </main>
</body>

</html>
